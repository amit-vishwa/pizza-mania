spring.datasource.jdbc-url=jdbc:h2:mem:pizza_mania_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep context tests deterministic and fully offline.
aws.region=us-east-1
aws.cognito.userPoolId=test-user-pool
environment=test
securitylayer.user.type.external=external
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.example.test

spring.app.jwtSecret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
spring.app.jwtExpirationMs=3600000

app.bootstrap-users.enabled=false
app.bootstrap-users.password=
