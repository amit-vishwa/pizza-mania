name: MySQL Schema Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mysql-schema:
    name: MySQL 8.4 / ${{ matrix.contract }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        contract: [PurchaseSchemaMySqlIT, PurchaseCheckoutMySqlIT]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-fixture-only
          MYSQL_DATABASE: pizza_mania_it
          MYSQL_USER: pizza_it
          MYSQL_PASSWORD: pizza-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PIZZA_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/pizza_mania_it?allowPublicKeyRetrieval=true&useSSL=false
      PIZZA_MYSQL_TEST_USER: pizza_it
      PIZZA_MYSQL_TEST_PASSWORD: pizza-fixture-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify local suites and selected MySQL contract
        run: mvn --batch-mode --no-transfer-progress -Pmysql-it -Dmysql.contract=${{ matrix.contract }} clean verify

      - name: Upload Maven test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-test-reports-${{ matrix.contract }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
            target/surefire-reports/*.dump
            target/surefire-reports/*.dumpstream
            target/failsafe-reports/*.xml
            target/failsafe-reports/*.txt
            target/failsafe-reports/*.dump
            target/failsafe-reports/*.dumpstream
          if-no-files-found: warn
          retention-days: 7
